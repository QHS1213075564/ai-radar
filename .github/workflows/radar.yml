name: radar
on:
  schedule:
    - cron: "0 4,8,12,18,22 * * *"   # UTC，约北京 12/16/20/02/06 点
  workflow_dispatch:
jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests pyyaml
      - name: collect
        run: python collect.py --mode radar
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - name: summarize+push
        run: python summarize.py radar
        env:
          GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"
          BARK_KEY: "${{ secrets.BARK_KEY }}"
          SERVERCHAN_KEY: "${{ secrets.SERVERCHAN_KEY }}"
          PUSHPLUS_TOKEN: "${{ secrets.PUSHPLUS_TOKEN }}"
      - name: persist state
        run: |
          git config user.email "radar@bot" && git config user.name "ai-radar"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add state/ && git diff --cached --quiet || git commit -m "radar state $(date -u +%FT%TZ)"
          git push origin HEAD
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}

# touched to force workflow registration
